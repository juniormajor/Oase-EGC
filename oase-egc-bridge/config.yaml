name: OASE EGC Bridge
version: "0.1.5"
slug: oase_egc_bridge
description: Lokale Anbindung der OASE EGC Teichpumpensteuerung (ONet) an Home Assistant via MQTT - ohne Cloud, ohne OASE-Konto.
url: https://github.com/juniormajor/Oase-EGC
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: manual
init: false
host_network: true
hassio_api: true
services:
  - mqtt:want
map:
  - addon_config:rw
options:
  controller_ip: "172.17.30.5"
  device_password: ""
  poll_interval: 10
  enable_control: false
  mode: bridge
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
  log_level: info
schema:
  controller_ip: str
  device_password: password
  poll_interval: int(2,3600)
  enable_control: bool
  mode: list(bridge|capture)?
  mqtt_host: str?
  mqtt_port: int(1,65535)?
  mqtt_user: str?
  mqtt_pass: password?
  log_level: list(debug|info|warning|error)?
